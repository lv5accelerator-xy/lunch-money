<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>午饭小助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>午饭小助手</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="wheel">今天吃什么</button>
      <button class="tab" data-tab="ledger">饭钱记账</button>
    </nav>
  </header>

  <main>
    <!-- 抽奖转盘 -->
    <section id="wheel" class="panel active">
      <div class="wheel-layout">
        <div class="wheel-box">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="600" height="600"></canvas>
          <button id="spinBtn" class="primary big">开始抽奖</button>
          <p id="result" class="result"></p>
        </div>

        <div class="card">
          <h2>饭店列表</h2>
          <form id="restaurantForm" class="row">
            <input id="restaurantInput" type="text" placeholder="输入饭店名字，回车添加" maxlength="30" autocomplete="off">
            <button type="submit" class="primary">添加</button>
          </form>
          <p class="hint">也可以一次粘贴多个，用逗号、顿号或换行分隔。</p>
          <ul id="restaurantList" class="list"></ul>
          <button id="clearRestaurants" class="danger-link">清空列表</button>
        </div>
      </div>
    </section>

    <!-- 记账 -->
    <section id="ledger" class="panel">
      <div class="balance card">
        <span class="label">当前余额（CAD）</span>
        <span id="balance" class="amount">$0.00</span>
        <span id="balanceSub" class="sub"></span>
      </div>

      <div class="ledger-layout">
        <div class="card">
          <h2>记一笔</h2>
          <form id="txForm" class="tx-form">
            <div class="seg">
              <label><input type="radio" name="type" value="expense" checked> 消费（扣除）</label>
              <label><input type="radio" name="type" value="deposit"> 存入（充值）</label>
            </div>
            <label>金额（加元 CAD）
              <input id="txAmount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" required>
            </label>
            <label>日期
              <input id="txDate" type="date" required>
            </label>
            <label>备注
              <input id="txNote" type="text" list="restaurantOptions" maxlength="50" placeholder="例如：饭店名 / 谁存的钱">
              <datalist id="restaurantOptions"></datalist>
            </label>
            <button type="submit" class="primary">保存</button>
          </form>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>流水记录</h2>
            <div class="tools">
              <button id="exportBtn" class="small">导出备份</button>
              <label class="small file-btn">导入备份<input id="importInput" type="file" accept="application/json" hidden></label>
            </div>
          </div>
          <div id="stats" class="stats"></div>
          <ul id="txList" class="list tx-list"></ul>
          <p id="txEmpty" class="hint">还没有记录。先存入一笔钱吧。</p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
